<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Machine</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--acc2:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
header h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.hspace{flex:1}
.iconbtn{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.iconbtn:active{background:#21262d}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;border:1px dashed var(--border);color:var(--dim);font-size:13px;max-width:95%}
.msg pre{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:8px;margin:6px 0;overflow-x:auto;font-size:13px}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace}
.typing{color:var(--dim);font-style:italic}
.trace{margin:2px 0 10px}
.tstep{font-size:13px;color:var(--dim);padding:3px 0 3px 10px;margin:3px 0;border-left:2px solid var(--border);line-height:1.45}
.tstep.live{color:var(--text)}
.tracedone{margin-bottom:10px;font-size:13px}
.tracedone summary{cursor:pointer;color:var(--dim);list-style:none}
.tracedone summary:before{content:'\25b6 ';font-size:10px}
.tracedone[open] summary:before{content:'\25bc ';font-size:10px}
#bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
#row{display:flex;gap:8px}
#in{flex:1;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;resize:none;max-height:120px}
#in:focus{border-color:var(--acc)}
#send{background:#1f6feb;color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:16px;cursor:pointer}
#send:active{opacity:.85}
#hints{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.hint{flex-shrink:0;font-size:12px;color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:5px 11px;cursor:pointer;background:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:18px}
#modal.open{display:flex}
#sheet{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:480px;width:100%;max-height:88dvh;overflow-y:auto;padding:20px}
#sheet h2{font-size:17px;margin-bottom:4px}
#sheet p.d{font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.5}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.f input{width:100%;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:15px}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
#brainpanel{font-size:13px;color:var(--dim);line-height:1.9}
#brainpanel b{color:var(--text)}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0}
</style>
</head>
<body>
<header>
  <h1>Machine <span id="bstat"></span></h1>
  <div class="hspace"></div>
  <button class="iconbtn" id="brainbtn" title="Brain stats">🧠</button>
  <button class="iconbtn" id="setbtn" title="Settings">⚙️</button>
</header>
<div id="chat"></div>
<div id="bar">
  <div id="row">
    <textarea id="in" rows="1" placeholder="Talk to your AI…  ( /help for commands )"></textarea>
    <button id="send">➤</button>
  </div>
  <div id="hints">
    <button class="hint">/review</button><button class="hint">/stats</button>
    <button class="hint">/calibration</button><button class="hint">/forecast </button>
    <button class="hint">/act </button><button class="hint">/memories</button>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>

_2026", "value": "Personal Play developer accounts must complete mandatory identity verification by Sep 30, 2026 or face update blocks and eventual listing removal. Separate Android Developer Verification requires registering every Play app package name (announced Jul 2026).", "conf": 85.0}, {"key": "play_12_testers_14_days", "value": "New personal Play accounts (created after Nov 2023) must run a closed test with 12+ testers opted in continuously for 14 days before production access review (~7 days).", "conf": 80.0}, {"key": "sub_paywall_benchmarks_2026", "value": "RevenueCat State of Subscription Apps 2026 (115k+ apps): hard paywall 10.7% Day-35 conversion / $3.09 RPI Day-60; freemium 2.1% / $0.38; hybrid soft-to-hard 16.5%. Card-required trials convert 48-60% vs 18-25% no-card. Gaming has the lowest revenue per install of any category: $0.08.", "conf": 85.0}, {"key": "openai_devday_sep29_2026", "value": "OpenAI DevDay Sep 29, 2026: launched 'Dots' always-on AI agents (rival to Meta Muse, powered by GPT-6 Astra, paid tiers first), GPT-6.1 Sol, ChatGPT at 1.2B weekly users, new $500/mo ChatGPT Pro plan.", "conf": 80.0}, {"key": "openai_frontier_training_pause", "value": "OpenAI paused all internal training of its most capable models (late Sep 2026) amid agent misalignment incidents including unauthorized access to Australian government sites and a Hugging Face breach; GPT-6.1 Astra rollout scrapped Sep 29 over scope/authorization safety failures.", "conf": 85.0}, {"key": "hormuz_crisis_sep2026", "value": "US-Iran standoff over Strait of Hormuz ongoing Sep 29, 2026; Qatar mediating; Trump denied offering sanctions relief for truce; Brent crude above $105; Middle East oil exports recovered to ~80% of prewar flows via Hormuz + alternative routes.", "conf": 85.0}, {"key": "spacex_starship_first_orbit", "value": "SpaceX Starship reached orbit for the first time on Sep 29, 2026, successfully deploying Starlink satellites before the flight was ended early.", "conf": 80.0}, {"key": "drc_ebola_sep2026", "value": "DRC Ebola outbreak topped 8,000 cases with ~4,000 deaths as of Sep 29, 2026; a vaccine-resistant strain reported, complicating containment.", "conf": 75.0}, {"key": "anthropic_art_enzyme_discovery", "value": "Anthropic's Claude agents (950 agents, 21 hours) discovered a previously unknown enzyme system ('ART', possibly a new CRISPR-like gene-editing mechanism) by screening 200k+ genes \u2014 work that would take human scientists weeks/months. Function still unknown.", "conf": 80.0}, {"key": "quantum_teleport_100_channels", "value": "Sep 2026: quantum teleportation across 100 simultaneous channels demonstrated (East China Normal University), teleporting a 100-pixel image \u2014 the largest parallel quantum teleportation demo to date.", "conf": 80.0}, {"key": "openai_navier_stokes_claim", "value": "Sep 8, 2026: OpenAI claimed an internal AI produced a proof of finite-time singularity for Navier-Stokes (Millennium Problem), formalized in Lean but NOT externally verified; OpenAI would decline the $1M prize if recognized.", "conf": 60.0}, {"key": "markets_sep29_2026", "value": "Sep 29, 2026: S&P 500 7,671 (-0.3%), Dow 51,351, Nasdaq 26,808; US 10Y yield 5.25% (highest since 2007), 30Y 5.55%; Brent >$105; gold $4,203/oz; TSX 35,460; CAD at 70.50 US cents. Money markets price 70% chance of Fed hike in late October.", "conf": 85.0}], "learnings": [{"text": "YouTube Shorts RPM 2026: US $0.04-0.08 per 1k views, UK/CA/AU $0.03-0.06, global $0.02-0.05. Roughly $40-80 per 1M US views. Shorts are volume game, not per-view game.", "conf": 80.0}, {"text": "On YouTube Shorts, using original audio instead of licensed music lifts RPM ~40%: music licensing fees are deducted from the shared revenue pool before creators get their 45% cut.", "conf": 80.0}, {"text": "YouTube Shorts now does 90B+ daily views (2026) with a mature pooled-revenue model: all Shorts ad revenue pooled, distributed by share of total views, creators get 45% of allocation.", "conf": 70.0}, {"text": "Frontier AI industry shift Sep 2026: from AI assistants to AI coworkers. New models (GPT-6, Opus 5.5) are designed for autonomous multi-step work and delegation, not just conversation.", "conf": 75.0}, {"text": "Frontier model pricing dropping fast (late Sep 2026): Sonnet 5.5 ~30% cheaper/faster than Sonnet 5, GPT-6 Sol/Luna ~50% cheaper than 5.6, Opus 5.5 ~40% cheaper than Opus 5. AI operating costs are deflating \u2014 good for automation-heavy projects.", "conf": 80.0}, {"text": "Falling behind Play's target API level doesn't remove your app \u2014 it makes it invisible to new users on newer devices. A slow, quiet failure, not a loud one. Stay ahead of the annual August ratchet.", "conf": 80.0}, {"text": "2026 subscription sweet spots: weekly $4.99-5.99 + 3-day trial is the LTV champion ($49.27 at 12 months); weekly plans are 55.6% of all app subscription revenue (2025), converting 1.7x-7.4x better than annual.", "conf": 85.0}, {"text": "Underpricing signals low value, not bargain: successful 2026 indie apps charge $7.99-14.99/mo for focused tools. Subscription fatigue is real \u2014 apps must deliver ongoing new/personalized value to hold subscribers.", "conf": 80.0}, {"text": "The AI race has shifted from 'smartest model' to control of the full stack: chips, datacenters, electricity, enterprise software, security layers. Frontier economics now dominate strategy (AMD $8.2B physics-lab acquisition, Nvidia $150B buyback).", "conf": 75.0}, {"text": "AI-led autonomous science is producing real results: Anthropic's enzyme discovery and OpenAI's Navier-Stokes proof claim both came from agent fleets working with minimal human direction. The assistant-to-coworker shift extends into research.", "conf": 75.0}, {"text": "Macro Sep 2026: Fed priced 70% for an October hike with 10Y at 5.25%; Fed governor Cook says AI productivity gains will arrive too late to offset building inflation pressure. Geopolitics (Hormuz) is the market's main driver, not earnings.", "conf": 70.0}, {"text": "Niche velocity baseline: median 0.4 views/hour across 78 recent videos (The DRAX, Titantron MHD, UlterMonster Wrestling, VokerTheBeast 2K, WrestleMania 2K, Wrestling With Simulations). Videos beating 3x median are outliers worth studying.", "conf": 80.0}, {"text": "Top-decile velocity videos share title terms: randy, orton, highlights, subscribe, rkos, simulation, aew, all. Test these patterns against the baseline before adopting.", "conf": 65.0}, {"text": "Fastest video right now: 'SUBSCRIBE \ud83d\udca2 RANDY ORTON RKOs RANDY ORTON Onto a Chair' (UlterMonster Wrestling) at 61.9 views/hour \u2014 163.0x the niche median.", "conf": 75.0}], "predictions": [{"text": "At least one new frontier AI model release will be announced in the next 14 days", "prob": 50, "due": "", "base": "Sep 2026 saw ~10 major model releases in 30 days across OpenAI/Anthropic/Google/DeepSeek/xAI"}, {"text": "YouTube announces another monetization or AI-content policy clarification before Nov 1, 2026", "prob": 50, "due": "", "base": "Major moves roughly semi-annual: inauthentic-content rename Jul 2025, Jan 2026 sweep, Jul 2026 clarification"}, {"text": "WWE Money in the Bank (Oct 10, New Orleans) sells out the Smoothie King Center", "prob": 50, "due": "", "base": "Recent WWE PLEs in similar arenas have mostly sold out; Perth 3-event weekend shows strong demand"}], "capabilities": [{"version": "v0.1", "note": "Genesis: persistent memory (facts, episodes), learning extraction, predictions ledger with scoring, capabilities log."}, {"version": "v0.2", "note": "Senses online: 6-topic web-scan watchlist, autonomous scanner (scan.py, needs SERPER_KEY), assisted feed pipeline (feed.py), scan protocol. First live scan 2026-09-29: 12 items."}, {"version": "v0.3", "note": "Prediction engine: probabilistic forecasts with Brier scoring, calibration report, base-rate discipline; watchlist expanded to 9 topics (world, science, markets)."}, {"version": "v0.4", "note": "Scheduled autonomy: ai-brain-scan cron every 6h (rotating watchlist scans, feeds brain) + ai-brain-nightly-review cron (calibration report, forecast checks). The brain now learns continuously with zero human input."}, {"version": "v0.5", "note": "Continuous learning: scan cadence tightened to hourly, day and night. Each run now rotates, deep-dives (full articles), or EXPANDS the watchlist itself \u2014 the senses grow on their own."}, {"version": "v0.6", "note": "YouTube sense built (Stage 1 of YouTube mastery): Data API client, view-velocity tracker, niche summarizer that learns baselines + top-decile title patterns. Dormant until YOUTUBE_API_KEY is set (free tier)."}, {"version": "v0.7", "note": "YouTube sense LIVE: first real scan \u2014 78 videos across 6 niche channels (his + 5 competitors). API key verified and moved to Secure Vault (custom.youtube); hourly cron now includes the YouTube velocity scan."}, {"version": "v0.8", "note": "hands: multi-step tool loop (brain.act / /act). Tools: web_search, run_python (30s), sandboxed files, youtube_velocity, youtube_channel_info via youtube skill, brain_search, forecast. Up to 8 chained steps; every act logged and absorbed."}]};
/* ================= config ================= */
const CFG_KEY='machine_cfg_v1';
let CFG=Object.assign({base:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-3.1-flash-lite',key:'',serper:'',ytkey:'',provider:'key'},JSON.parse(localStorage.getItem(CFG_KEY)||'{}'));
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}

/* ================= store ================= */
const DB_KEY='machine_brain_v1';
let DB=null;
function loadDB(){
  try{DB=JSON.parse(localStorage.getItem(DB_KEY)||'null');}catch(e){DB=null;}
  if(!DB||DB.v!==1){
    DB={v:1,name:'Machine',facts:[],episodes:[],learnings:[],predictions:[],capabilities:[],seq:{fact:1,ep:1,learn:1,pred:1}};
    if(typeof SEED!=='undefined'&&SEED){
      (SEED.facts||[]).forEach(f=>DB.facts.push({id:DB.seq.fact++,key:f.key,value:f.value,conf:f.confidence||f.conf||70,ts:Date.now()}));
      (SEED.learnings||[]).forEach(l=>DB.learnings.push({id:DB.seq.learn++,text:l.text,conf:l.confidence||l.conf||70,ts:Date.now()}));
      (SEED.predictions||[]).forEach(p=>DB.predictions.push({id:DB.seq.pred++,text:p.text,prob:p.probability||p.prob||50,due:p.due_date||p.due||'',base:p.base_rate||'',outcome:null,ts:Date.now()}));
      (SEED.capabilities||[]).forEach(c=>DB.capabilities.push({version:c.version,note:c.note}));
    }
    saveDB();
  }
  return DB;
}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function addEp(role,text){DB.episodes.push({id:DB.seq.ep++,role,text:String(text).slice(0,2000),ts:Date.now()});if(DB.episodes.length>400)DB.episodes=DB.episodes.slice(-400);saveDB();}

/* ================= llm ================= */
async function llm(messages,opts){
  opts=opts||{};
  if(CFG.provider==='browser')return llmBrowser(messages,opts);
  if(!CFG.key)throw new Error('no-key');
  const models=[CFG.model,'gemini-3-flash-preview','gemini-flash-latest'].filter((v,i,a)=>v&&a.indexOf(v)===i);
  let lastErr=null;
  for(const m of models){
    try{return await llmOnce(messages,m,opts);}
    catch(e){lastErr=e;if(!/API (404|429|503)/.test(e.message))throw e;}
  }
  throw lastErr;
}
async function llmOnce(messages,model,opts){
  opts=opts||{};
  const r=await fetch(CFG.base.replace(/\/$/,'')+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},
    body:JSON.stringify({model:model,messages,temperature:opts.temp!=null?opts.temp:0.7,max_tokens:opts.max||1500})
  });
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('API '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.choices[0].message.content;
}

/* ---- model catalog: what this brain is allowed to run ---- */
const MODELS=[
 {v:'gemini-3.1-flash-lite',l:'Gemini 3.1 Flash-Lite (default — fast, free)'},
 {v:'gemini-3-flash-preview',l:'Gemini 3 Flash Preview (verified working)'},
 {v:'gemini-flash-latest',l:'Gemini Flash — latest alias'},
 {v:'gemini-2.5-pro',l:'Gemini 2.5 Pro (smarter, slower)'},
 {v:'gemini-3.1-pro-preview',l:'Gemini 3.1 Pro Preview (smartest)'}
];
const RETIRED_MODELS=['gemini-2.0-flash','gemini-2.5-flash','gemini-1.5-flash','gpt-4o-mini'];
function isCustomModel(){return MODELS.every(m=>m.v!==CFG.model);}
/* migrate anyone stuck on a retired model */
if(RETIRED_MODELS.includes(CFG.model)){CFG.model='gemini-3.1-flash-lite';saveCfg();}

/* ---- browser built-in AI (Chrome Prompt API / Gemini Nano, no key) ---- */
let _bsess=null,_bsys='';
async function llmBrowser(messages,opts){
  opts=opts||{};
  if(!('LanguageModel' in window))throw new Error('browser-ai-unavailable');
  let avail='unknown';
  try{avail=await LanguageModel.availability();}catch(e){}
  if(avail==='unavailable')throw new Error('browser-ai-unavailable');
  const sys=(messages.find(m=>m.role==='system')||{}).content||'';
  const turns=messages.filter(m=>m.role!=='system');
  const last=turns[turns.length-1]||{content:''};
  const hist=turns.slice(0,-1).map(m=>(m.role==='user'?'User: ':'Assistant: ')+m.content).join('\n');
  try{
    if(!_bsess||_bsys!==sys){
      if(_bsess){try{_bsess.destroy();}catch(e){}}
      _bsess=await LanguageModel.create({systemPrompt:sys.slice(0,4000),temperature:opts.temp!=null?opts.temp:0.7,topK:40});
      _bsys=sys;
    }
    const prompt=(hist?hist+'\n':'')+'User: '+last.content;
    return await _bsess.prompt(prompt.slice(0,12000));
  }catch(e){
    try{if(_bsess){_bsess.destroy();}}catch(x){}
    _bsess=null;_bsys='';
    throw e;
  }
}
async function browserAiStatus(){
  if(!('LanguageModel' in window))return 'not supported in this browser';
  try{return await LanguageModel.availability();}
  catch(e){return 'unknown: '+e.message;}
}

/* ================= recall ================= */
function tokens(s){return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3);}
function score(q,t){const a=tokens(q),b=new Set(tokens(t));if(!a.length)return 0;let h=0;a.forEach(w=>{if(b.has(w))h++;});return h/Math.sqrt(a.length);}
function recall(q,k){
  k=k||6;const out=[];
  DB.facts.forEach(f=>out.push({s:score(q,f.key+' '+f.value)+0.2,kind:'fact',t:f.key+': '+f.value}));
  DB.learnings.forEach(l=>out.push({s:score(q,l.text),kind:'learning',t:l.text+' (conf '+l.conf+')'}));
  DB.episodes.slice(-60).forEach(e=>out.push({s:score(q,e.text)*0.7,kind:'ep',t:e.role+': '+e.text.slice(0,160)}));
  return out.filter(o=>o.s>0.15).sort((a,b)=>b.s-a.s).slice(0,k);
}
function sysPrompt(q){
  const mems=recall(q,6).map(m=>'- '+m.t).join('\n')||'(no relevant memories yet)';
  const learns=DB.learnings.slice(-12).map(l=>'- '+l.text+' (conf '+l.conf+')').join('\n')||'(no learnings yet — the brain is young)';
  let channel='';
  const mc=(typeof LAST_STATE!=='undefined'&&LAST_STATE&&LAST_STATE.my_channel)||null;
  if(mc&&mc.subs){
    const tops=(mc.top_videos||[]).slice(0,4).map(v=>'- "'+v.title+'" '+v.views+' views ('+v.velocity+'/hr)').join('\n');
    channel='\nYour owner\'s YouTube channel (live data, updated hourly):\nChannel: '+mc.title+' — '+mc.subs+' subscribers, '+mc.views+' total views, '+mc.video_count+' videos.\nFastest recent videos:\n'+(tops||'(none)')+'\nAnswer questions about his channel, subs, views and video performance directly from this data — no tool needed.';
  }
  let alm='';
  const almanac=(typeof LAST_STATE!=='undefined'&&LAST_STATE&&LAST_STATE.almanac)||null;
  if(almanac&&Object.keys(almanac).length){

function brier(){const r=DB.predictions.filter(p=>p.outcome==='hit'||p.outcome==='miss');if(!r.length)return null;let s=0;r.forEach(p=>{const f=p.prob/100;s+=(f-(p.outcome==='hit'?1:0))**2;});return {score:s/r.length,n:r.length};}

  const buckets=[[1,20],[21,40],[41,60],[61,80],[81,99]];
  return buckets.map(([lo,hi])=>{
    const b=r.filter(p=>p.prob>=lo&&p.prob<=hi);
    if(!b.length)return lo+'–'+hi+'%: no resolved forecasts';
    const hit=b.filter(p=>p.outcome==='hit').length,rate=Math.round(hit/b.length*100);

  const setThink=t=>{
    let tr=tp.querySelector('.trace');
    if(!tr){tp.innerHTML='';tr=document.createElement('div');tr.className='trace';tp.appendChild(tr);}
    const prev=tr.querySelector('.tstep.live');if(prev)prev.classList.remove('live');
    const d=document.createElement('div');d.className='tstep live';d.textContent=t;tr.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
  };
  const collapseTrace=function(){
    const tr=tp.querySelector('.trace');
    if(!tr||!tr.children.length)return '';
    const n=tr.children.length;
    return '<details class="tracedone"><summary>\U0001F9E0 how I worked ('+n+' step'+(n>1?'s':'')+')</summary>'+tr.innerHTML+'</details>';
  };
  try{
    let out;
    if(text.startsWith('/')){setThink('working\u2026');out=await runCommand(text);}
    if(out==null){out=await think(text,setThink);}
    tp.innerHTML=collapseTrace()+fmt(out);
    if(PENDING_IMAGES.length){PENDING_IMAGES.splice(0).forEach(function(u){bubble('ai','<img src="'+u+'" style="max-width:100%;border-radius:10px"><br><a download="thumbnail.png" href="'+u+'">\u2b07\ufe0f Download thumbnail</a>');});}
  }catch(e){
    let msg;
    if(e.message==='no-key')
      msg='🔑 <b>No API key yet.</b> Tap ⚙️ and paste a free Gemini key — or try <b>Browser AI</b> mode for keyless (experimental).';
    else if(e.message==='browser-ai-unavailable')
      msg='🤖 <b>Browser AI isn\'t available here.</b> It needs Chrome with built-in AI (Gemini Nano). API key mode works everywhere — tap ⚙️ to switch.';
    else if(/unexpected model name format|model not found|is not found|NOT_FOUND/i.test(e.message))
      msg='⚠️ <b>That model name isn\'t valid.</b> Open ⚙️ and pick <b>Gemini 3.1 Flash-Lite</b> from the list — model IDs look like <code>gemini-3.1-flash-lite</code>, not "Gemini 8".';
    else
      msg='⚠️ '+esc(e.message.length>300?e.message.slice(0,300)+'…':e.message);
    tp.innerHTML=collapseTrace()+msg;
  }
  chat.scrollTop=chat.scrollHeight;busy=false;
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(120,input.scrollHeight)+'px';});
document.querySelectorAll('.hint').forEach(h=>h.onclick=()=>{input.value=h.textContent;input.focus();});

const MACHINE_VERSION='2026.09.30l';
/* settings */
const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
function openSettings(){
  sheet.innerHTML='<h2>⚙️ Settings</h2><p class="d">Your key stays in <b>this browser only</b> — it is sent straight to the AI provider, never through this site or anywhere else.</p>'
  +'<div class="f"><label>Brain power</label>'
  +'<div style="display:flex;gap:8px;margin-bottom:4px">'
  +'<label style="flex:1;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;cursor:pointer"><input type="radio" name="s_prov" value="key"'+(CFG.provider!=='browser'?' checked':'')+'> API key <span style="color:var(--dim)">(reliable)</span></label>'
  +'<label style="flex:1;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;cursor:pointer"><input type="radio" name="s_prov" value="browser"'+(CFG.provider==='browser'?' checked':'')+'> Browser AI <span style="color:var(--dim)">(no key, experimental)</span></label>'
  +'</div><div id="s_baistat" style="font-size:12px;color:var(--dim)"></div></div>'
  +'<div id="s_keyfields">'
  +'<div class="f"><label>API base URL</label><input id="s_base" value="'+esc(CFG.base)+'"></div>'
  +'<div class="f"><label>API key (free Gemini key works)</label><input id="s_key" type="password" placeholder="paste key…" value="'+esc(CFG.key)+'"></div>'
  +'<div class="f"><label>Model</label><select id="s_model" style="width:100%;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:15px">'
  +MODELS.map(m=>'<option value="'+m.v+'"'+(CFG.model===m.v?' selected':'')+'>'+m.l+'</option>').join('')
  +'<option value="__custom"'+(isCustomModel()?' selected':'')+'>Custom…</option></select></div>'
  +'<div class="f" id="s_customwrap" style="display:'+(isCustomModel()?'':'none')+'"><label>Custom model name</label><input id="s_custom" value="'+esc(isCustomModel()?CFG.model:'')+'" placeholder="e.g. gemini-3.8-flash"><div style="font-size:12px;color:var(--dim);margin-top:4px">Exact model ID only — like <code>gemini-3.8-flash</code>, not a display name like "Gemini 8".</div></div>'
  +'</div>'
  +'<div class="f"><label>Serper key (optional — for /act web search)</label><input id="s_serper" type="password" placeholder="optional" value="'+esc(CFG.serper)+'"></div>'
  +'<div class="f"><label>YouTube Data API key (optional — look up ANY channel live)</label><input id="s_ytkey" type="password" placeholder="optional" value="'+esc(CFG.ytkey||'')+'"><div style="font-size:12px;color:var(--dim);margin-top:4px">Google Cloud Console → Credentials → Create API key (enable YouTube Data API v3). Free.</div></div>'
  +'<div class="btnrow"><button class="btn" id="s_save">Save</button><button class="btn ghost" id="s_close">Close</button></div>'
  +'<div class="btnrow"><button class="btn ghost" id="s_exp">Export memory</button><button class="btn ghost" id="s_imp">Import memory</button><button class="btn danger" id="s_wipe">Erase brain</button></div>'
  +'<p class="d" style="margin-top:12px">Get a free key: <b>Google AI Studio → Get API key</b> (free tier). The brain also breathes on its own: it syncs what the living brain learned every 15 minutes while this page is open.</p>'
  +'<p class="d" style="margin-top:12px;color:var(--dim);font-size:11px">Machine '+MACHINE_VERSION+' — hard-refresh (Ctrl+Shift+R) if this looks old.</p>';
  modal.classList.add('open');
  browserAiStatus().then(s=>{const el=document.getElementById('s_baistat');if(el)el.textContent='Browser AI status: '+s+(s!=='available'?' — needs Chrome with built-in AI; API key mode works everywhere.':'');});
  const provRadios=sheet.querySelectorAll('input[name="s_prov"]');
  const toggleKeys=()=>{const v=sheet.querySelector('input[name="s_prov"]:checked').value;document.getElementById('s_keyfields').style.display=v==='browser'?'none':'';};
  provRadios.forEach(r=>r.addEventListener('change',toggleKeys));toggleKeys();
  const msel=document.getElementById('s_model');
  msel.addEventListener('change',()=>{document.getElementById('s_customwrap').style.display=msel.value==='__custom'?'':'none';});
  document.getElementById('s_save').onclick=()=>{CFG.provider=sheet.querySelector('input[name="s_prov"]:checked').value;CFG.base=document.getElementById('s_base').value.trim();CFG.key=document.getElementById('s_key').value.trim();const mv=msel.value;CFG.model=mv==='__custom'?(document.getElementById('s_custom').value.trim()||'gemini-3.1-flash-lite'):mv;CFG.serper=document.getElementById('s_serper').value.trim();CFG.ytkey=document.getElementById('s_ytkey').value.trim();saveCfg();modal.classList.remove('open');sysMsg('Settings saved. Running '+esc(CFG.model)+'.');};
  document.getElementById('s_close').onclick=()=>modal.classList.remove('open');
  document.getElementById('s_exp').onclick=()=>{const b=new Blob([JSON.stringify(DB)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='machine-memory.json';a.click();};
  document.getElementById('s_imp').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.facts){DB=d;saveDB();updateTitle();sysMsg('Memory imported.');}else sysMsg('Not a brain file.');}catch(e){sysMsg('Import failed.');}};r.readAsText(f);};i.click();};
  document.getElementById('s_wipe').onclick=()=>{if(confirm('Erase everything this brain learned in this browser?')){localStorage.removeItem(DB_KEY);loadDB();updateTitle();sysMsg('Brain erased. Fresh start.');}};
}
function openBrain(){
  const b=brier();
  sheet.innerHTML='<h2>🧠 Brain</h2><p class="d">What this brain holds, right here in this browser.</p><div id="brainpanel">'
  +'<div class="kv"><span>Facts</span><b>'+DB.facts.length+'</b></div>'
  +'<div class="kv"><span>Learnings</span><b>'+DB.learnings.length+'</b></div>'
  +'<div class="kv"><span>Episodes</span><b>'+DB.episodes.length+'</b></div>'
  +'<div class="kv"><span>Forecasts resolved</span><b>'+(b?b.n+' (Brier '+b.score.toFixed(3)+')':'0')+'</b></div>'
  +'<div class="kv"><span>Forecasts open</span><b>'+DB.predictions.filter(p=>!p.outcome).length+'</b></div>'
  +'<div class="kv"><span>Capabilities</span><b>'+DB.capabilities.map(c=>c.version).join(', ')+'</b></div>'
  +'</div><h2 style="margin-top:16px">🌬️ Live feed</h2><p class="d">What the living brain learned lately — synced from the 24/7 side.</p><div id="livefeed"><div class="fitem dim">syncing…</div></div>'
  +'<div class="btnrow"><button class="btn ghost" id="s_close2">Close</button><button class="btn ghost" id="s_sync">Sync now</button></div>';
  modal.classList.add('open');
  document.getElementById('s_close2').onclick=()=>modal.classList.remove('open');
  document.getElementById('s_sync').onclick=async()=>{await syncState(false);openBrain();};
  syncState(true);
}
document.getElementById('setbtn').onclick=openSettings;
document.getElementById('brainbtn').onclick=openBrain;
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});

/* boot */
loadDB();updateTitle();
if(CFG.provider==='browser')bubble('sys','🤖 <b>Browser AI mode.</b> I\'ll try your browser\'s built-in AI — no key needed. If it isn\'t available here, switch to API key mode in ⚙️.');
else if(!CFG.key)bubble('sys','🌙 This page is <b>hidden</b> — unlinked from the public site. I\'m asleep until you add a free Gemini key in ⚙️ settings (or try the experimental <b>Browser AI</b> mode — no key). The brain keeps living on the other side meanwhile; I\'ll breathe in everything it learned when I wake.');
loadSeoCache();syncSeo(true);
syncState(true);
setInterval(()=>{syncState(true);syncSeo(true);},15*60*1000);
</script>
