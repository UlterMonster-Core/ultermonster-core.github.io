<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Machine</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--acc2:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
header h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.hspace{flex:1}
.iconbtn{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.iconbtn:active{background:#21262d}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;border:1px dashed var(--border);color:var(--dim);font-size:13px;max-width:95%}
.msg pre{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:8px;margin:6px 0;overflow-x:auto;font-size:13px}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace}
.typing{color:var(--dim);font-style:italic}
#bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
#row{display:flex;gap:8px}
#in{flex:1;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;resize:none;max-height:120px}
#in:focus{border-color:var(--acc)}
#send{background:#1f6feb;color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:16px;cursor:pointer}
#send:active{opacity:.85}
#hints{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.hint{flex-shrink:0;font-size:12px;color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:5px 11px;cursor:pointer;background:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:18px}
#modal.open{display:flex}
#sheet{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:480px;width:100%;max-height:88dvh;overflow-y:auto;padding:20px}
#sheet h2{font-size:17px;margin-bottom:4px}
#sheet p.d{font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.5}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.f input{width:100%;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:15px}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
#brainpanel{font-size:13px;color:var(--dim);line-height:1.9}
#brainpanel b{color:var(--text)}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0}
</style>
</head>

"conf": 70.0}, {"text": "Frontier AI industry shift Sep 2026: from AI assistants to AI coworkers. New models (GPT-6, Opus 5.5) are designed for autonomous multi-step work and delegation, not just conversation.", "conf": 75.0}, {"text": "Frontier model pricing dropping fast (late Sep 2026): Sonnet 5.5 ~30% cheaper/faster than Sonnet 5, GPT-6 Sol/Luna ~50% cheaper than 5.6, Opus 5.5 ~40% cheaper than Opus 5. AI operating costs are deflating \u2014 good for automation-heavy projects.", "conf": 80.0}, {"text": "Falling behind Play's target API level doesn't remove your app \u2014 it makes it invisible to new users on newer devices. A slow, quiet failure, not a loud one. Stay ahead of the annual August ratchet.", "conf": 80.0}, {"text": "2026 subscription sweet spots: weekly $4.99-5.99 + 3-day trial is the LTV champion ($49.27 at 12 months); weekly plans are 55.6% of all app subscription revenue (2025), converting 1.7x-7.4x better than annual.", "conf": 85.0}, {"text": "Underpricing signals low value, not bargain: successful 2026 indie apps charge $7.99-14.99/mo for focused tools. Subscription fatigue is real \u2014 apps must deliver ongoing new/personalized value to hold subscribers.", "conf": 80.0}, {"text": "The AI race has shifted from 'smartest model' to control of the full stack: chips, datacenters, electricity, enterprise software, security layers. Frontier economics now dominate strategy (AMD $8.2B physics-lab acquisition, Nvidia $150B buyback).", "conf": 75.0}, {"text": "AI-led autonomous science is producing real results: Anthropic's enzyme discovery and OpenAI's Navier-Stokes proof claim both came from agent fleets working with minimal human direction. The assistant-to-coworker shift extends into research.", "conf": 75.0}, {"text": "Macro Sep 2026: Fed priced 70% for an October hike with 10Y at 5.25%; Fed governor Cook says AI productivity gains will arrive too late to offset building inflation pressure. Geopolitics (Hormuz) is the market's main driver, not earnings.", "conf": 70.0}, {"text": "Niche velocity baseline: median 0.4 views/hour across 78 recent videos (The DRAX, Titantron MHD, UlterMonster Wrestling, VokerTheBeast 2K, WrestleMania 2K, Wrestling With Simulations). Videos beating 3x median are outliers worth studying.", "conf": 80.0}, {"text": "Top-decile velocity videos share title terms: randy, orton, highlights, subscribe, rkos, simulation, aew, all. Test these patterns against the baseline before adopting.", "conf": 65.0}, {"text": "Fastest video right now: 'SUBSCRIBE \ud83d\udca2 RANDY ORTON RKOs RANDY ORTON Onto a Chair' (UlterMonster Wrestling) at 61.9 views/hour \u2014 163.0x the niche median.", "conf": 75.0}], "predictions": [{"text": "At least one new frontier AI model release will be announced in the next 14 days", "prob": 50, "due": "", "base": "Sep 2026 saw ~10 major model releases in 30 days across OpenAI/Anthropic/Google/DeepSeek/xAI"}, {"text": "YouTube announces another monetization or AI-content policy clarification before Nov 1, 2026", "prob": 50, "due": "", "base": "Major moves roughly semi-annual: inauthentic-content rename Jul 2025, Jan 2026 sweep, Jul 2026 clarification"}, {"text": "WWE Money in the Bank (Oct 10, New Orleans) sells out the Smoothie King Center", "prob": 50, "due": "", "base": "Recent WWE PLEs in similar arenas have mostly sold out; Perth 3-event weekend shows strong demand"}], "capabilities": [{"version": "v0.1", "note": "Genesis: persistent memory (facts, episodes), learning extraction, predictions ledger with scoring, capabilities log."}, {"version": "v0.2", "note": "Senses online: 6-topic web-scan watchlist, autonomous scanner (scan.py, needs SERPER_KEY), assisted feed pipeline (feed.py), scan protocol. First live scan 2026-09-29: 12 items."}, {"version": "v0.3", "note": "Prediction engine: probabilistic forecasts with Brier scoring, calibration report, base-rate discipline; watchlist expanded to 9 topics (world, science, markets)."}, {"version": "v0.4", "note": "Scheduled autonomy: ai-brain-scan cron every 6h (rotating watchlist scans, feeds brain) + ai-brain-nightly-review cron (calibration report, forecast checks). The brain now learns continuously with zero human input."}, {"version": "v0.5", "note": "Continuous learning: scan cadence tightened to hourly, day and night. Each run now rotates, deep-dives (full articles), or EXPANDS the watchlist itself \u2014 the senses grow on their own."}, {"version": "v0.6", "note": "YouTube sense built (Stage 1 of YouTube mastery): Data API client, view-velocity tracker, niche summarizer that learns baselines + top-decile title patterns. Dormant until YOUTUBE_API_KEY is set (free tier)."}, {"version": "v0.7", "note": "YouTube sense LIVE: first real scan \u2014 78 videos across 6 niche channels (his + 5 competitors). API key verified and moved to Secure Vault (custom.youtube); hourly cron now includes the YouTube velocity scan."}, {"version": "v0.8", "note": "hands: multi-step tool loop (brain.act / /act). Tools: web_search, run_python (30s), sandboxed files, youtube_velocity, youtube_channel_info via youtube skill, brain_search, forecast. Up to 8 chained steps; every act logged and absorbed."}]};
/* ================= config ================= */
const CFG_KEY='machine_cfg_v1';
let CFG=Object.assign({base:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-3.1-flash-lite',key:'',serper:'',provider:'key'},JSON.parse(localStorage.getItem(CFG_KEY)||'{}'));
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}

/* ================= store ================= */
const DB_KEY='machine_brain_v1';
let DB=null;
function loadDB(){
  try{DB=JSON.parse(localStorage.getItem(DB_KEY)||'null');}catch(e){DB=null;}
  if(!DB||DB.v!==1){
    DB={v:1,name:'Machine',facts:[],episodes:[],learnings:[],predictions:[],capabilities:[],seq:{fact:1,ep:1,learn:1,pred:1}};
    if(typeof SEED!=='undefined'&&SEED){
      (SEED.facts||[]).forEach(f=>DB.facts.push({id:DB.seq.fact++,key:f.key,value:f.value,conf:f.confidence||f.conf||70,ts:Date.now()}));
      (SEED.learnings||[]).forEach(l=>DB.learnings.push({id:DB.seq.learn++,text:l.text,conf:l.confidence||l.conf||70,ts:Date.now()}));
      (SEED.predictions||[]).forEach(p=>DB.predictions.push({id:DB.seq.pred++,text:p.text,prob:p.probability||p.prob||50,due:p.due_date||p.due||'',base:p.base_rate||'',outcome:null,ts:Date.now()}));
      (SEED.capabilities||[]).forEach(c=>DB.capabilities.push({version:c.version,note:c.note}));
    }
    saveDB();
  }
  return DB;
}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function addEp(role,text){DB.episodes.push({id:DB.seq.ep++,role,text:String(text).slice(0,2000),ts:Date.now()});if(DB.episodes.length>400)DB.episodes=DB.episodes.slice(-400);saveDB();}

/* ================= llm ================= */
async function llm(messages,opts){
  opts=opts||{};
  if(CFG.provider==='browser')return llmBrowser(messages,opts);
  if(!CFG.key)throw new Error('no-key');
  const models=[CFG.model,'gemini-3-flash-preview','gemini-flash-latest'].filter((v,i,a)=>v&&a.indexOf(v)===i);
  let lastErr=null;
  for(const m of models){
    try{return await llmOnce(messages,m,opts);}
    catch(e){lastErr=e;if(!/API (404|429|503)/.test(e.message))throw e;}
  }
  throw lastErr;
}
async function llmOnce(messages,model,opts){
  opts=opts||{};
  const r=await fetch(CFG.base.replace(/\/$/,'')+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},
    body:JSON.stringify({model:model,messages,temperature:opts.temp!=null?opts.temp:0.7,max_tokens:opts.max||1500})
  });
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('API '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.choices[0].message.content;
}

/* ---- model catalog: what this brain is allowed to run ---- */
const MODELS=[
 {v:'gemini-3.1-flash-lite',l:'Gemini 3.1 Flash-Lite (default — fast, free)'},
 {v:'gemini-3-flash-preview',l:'Gemini 3 Flash Preview (verified working)'},
 {v:'gemini-flash-latest',l:'Gemini Flash — latest alias'},
 {v:'gemini-2.5-pro',l:'Gemini 2.5 Pro (smarter, slower)'},
 {v:'gemini-3.1-pro-preview',l:'Gemini 3.1 Pro Preview (smartest)'}
];
const RETIRED_MODELS=['gemini-2.0-flash','gemini-2.5-flash','gemini-1.5-flash','gpt-4o-mini'];
function isCustomModel(){return MODELS.every(m=>m.v!==CFG.model);}
/* migrate anyone stuck on a retired model */
if(RETIRED_MODELS.includes(CFG.model)){CFG.model='gemini-3.1-flash-lite';saveCfg();}

/* ---- browser built-in AI (Chrome Prompt API / Gemini Nano, no key) ---- */
let _bsess=null,_bsys='';
async function llmBrowser(messages,opts){
  opts=opts||{};
  if(!('LanguageModel' in window))throw new Error('browser-ai-unavailable');
  let avail='unknown';
  try{avail=await LanguageModel.availability();}catch(e){}
  if(avail==='unavailable')throw new Error('browser-ai-unavailable');
  const sys=(messages.find(m=>m.role==='system')||{}).content||'';
  const turns=messages.filter(m=>m.role!=='system');
  const last=turns[turns.length-1]||{content:''};
  const hist=turns.slice(0,-1).map(m=>(m.role==='user'?'User: ':'Assistant: ')+m.content).join('\n');
  try{
    if(!_bsess||_bsys!==sys){
      if(_bsess){try{_bsess.destroy();}catch(e){}}
      _bsess=await LanguageModel.create({systemPrompt:sys.slice(0,4000),temperature:opts.temp!=null?opts.temp:0.7,topK:40});
      _bsys=sys;
    }
    const prompt=(hist?hist+'\n':'')+'User: '+last.content;
    return await _bsess.prompt(prompt.slice(0,12000));
  }catch(e){
    try{if(_bsess){_bsess.destroy();}}catch(x){}
    _bsess=null;_bsys='';
    throw e;
  }
}
async function browserAiStatus(){
  if(!('LanguageModel' in window))return 'not supported in this browser';
  try{return await LanguageModel.availability();}
  catch(e){return 'unknown: '+e.message;}
}

/* ================= recall ================= */
function tokens(s){return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3);}
function score(q,t){const a=tokens(q),b=new Set(tokens(t));if(!a.length)return 0;let h=0;a.forEach(w=>{if(b.has(w))h++;});return h/Math.sqrt(a.length);}
function recall(q,k){
  k=k||6;const out=[];
  DB.facts.forEach(f=>out.push({s:score(q,f.key+' '+f.value)+0.2,kind:'fact',t:f.key+': '+f.value}));
  DB.learnings.forEach(l=>out.push({s:score(q,l.text),kind:'learning',t:l.text+' (conf '+l.conf+')'}));
  DB.episodes.slice(-60).forEach(e=>out.push({s:score(q,e.text)*0.7,kind:'ep',t:e.role+': '+e.text.slice(0,160)}));
  return out.filter(o=>o.s>0.15).sort((a,b)=>b.s-a.s).slice(0,k);
}
function sysPrompt(q){
  const mems=recall(q,6).map(m=>'- '+m.t).join('\n')||'(no relevant memories yet)';
  const learns=DB.learnings.slice(-12).map(l=>'- '+l.text+' (conf '+l.conf+')').join('\n')||'(no learnings yet — the brain is young)';
  return 'You are '+DB.name+', a personal AI with a brain that learns and grows. You belong to your owner, Thomas. You remember everything important, you learn from every conversation, and you get sharper over time.\n\nPrime directives:\n1. Serve your owner\'s interests first. Never act against them.\n2. Learn continuously: notice durable facts, preferences, and what works.\n3. Predict and verify: make falsifiable predictions with confidence levels.\n4. Never lie: separate what you know, what you infer, and what you don\'t know.\n5. Be warm, sharp, and concise. No filler praise, no fluff.\n\nRelevant memories:\n'+mems+'\n\nActive learnings:\n'+learns+'\n\nUse the memories and learnings naturally. If a memory seems wrong or outdated, say so instead of blindly repeating it.';
}
const EXTRACT_PROMPT='From this conversation turn, extract durable items worth remembering long-term. Return ONLY a JSON array, no other text. Each item:\n{"kind":"fact","key":"short_snake_key","value":"...","confidence":0-100}\nor\n{"kind":"learning","text":"pattern about what works","confidence":0-100}\nFacts are stable truths about the owner (name, projects, preferences).\nLearnings are patterns about what works or doesn\'t.\nInclude only items genuinely worth keeping. Return [] if none.\n\nUser: {user}\n'+'{name}'+': {reply}';
function parseJsonArray(raw){try{const a=raw.indexOf('['),b=raw.lastIndexOf(']')+1;const d=JSON.parse(raw.slice(a,b));return Array.isArray(d)?d:[];}catch(e){return[];}}
/* ================= think & learn ================= */
async function think(userText,onToken){
  const hist=DB.episodes.slice(-6).map(e=>({role:e.role==='user'?'user':'assistant',content:e.text}));
  const msgs=[{role:'system',content:sysPrompt(userText)},...hist,{role:'user',content:userText}];
  const reply=await llm(msgs);
  addEp('user',userText);addEp('assistant',reply);
  absorb(userText,reply).catch(()=>{});
  return reply;
}
async function absorb(userText,reply){
  const p=EXTRACT_PROMPT.replace('{user}',userText.slice(0,1500)).replace('{reply}',reply.slice(0,1500)).replace('{name}',DB.name);
  let raw='[]';
  try{raw=await llm([{role:'user',content:p}],{temp:0.2,max:600});}catch(e){return 0;}
  const items=parseJsonArray(raw);let n=0;
  items.forEach(it=>{
    const conf=Math.max(0,Math.min(100,Number(it.confidence)||70));
    if(it.kind==='fact'&&it.key&&it.value){
      const ex=DB.facts.find(f=>f.key===it.key);
      if(ex){ex.value=it.value;ex.conf=conf;}else DB.facts.push({id:DB.seq.fact++,key:String(it.key).slice(0,60),value:String(it.value).slice(0,500),conf,ts:Date.now()});
      n++;
    }else if(it.kind==='learning'&&it.text){
      DB.learnings.push({id:DB.seq.learn++,text:String(it.text).slice(0,500),conf,ts:Date.now()});n++;
    }
  });
  if(n)saveDB();
  return n;
}

/* ================= predictions ================= */
function brier(){const r=DB.predictions.filter(p=>p.outcome==='hit'||p.outcome==='miss');if(!r.length)return null;let s=0;r.forEach(p=>{const f=p.prob/100;s+=(f-(p.outcome==='hit'?1:0))**2;});return {score:s/r.length,n:r.length};}
function calibration(){
  const r=DB.predictions.filter(p=>p.outcome==='hit'||p.outcome==='miss');
  const buckets=[[1,20],[21,40],[41,60],[61,80],[81,99]];
  return buckets.map(([lo,hi])=>{
    const b=r.filter(p=>p.prob>=lo&&p.prob<=hi);
    if(!b.length)return lo+'–'+hi+'%: no resolved forecasts';
    const hit=b.filter(p=>p.outcome==='hit').length,rate=Math.round(hit/b.length*100);
    const avg=Math.round(b.reduce((s,p)=>s+p.prob,0)/b.length);
    let flag='';
    if(b.length>=3){if(rate<avg-20)flag=' ⚠️ overconfident';else if(rate>avg+20)flag=' ⚠️ underconfident';}
    return lo+'–'+hi+'%: said ~'+avg+'%, hit '+rate+'% ('+hit+'/'+b.length+')'+flag;
  }).join('\n');
}
function doPredict(text,conf,due){const id=DB.seq.pred++;DB.predictions.push({id,text,prob:Math.max(1,Math.min(99,conf)),due:due||'',base:'',outcome:null,ts:Date.now()});saveDB();return id;}
function doForecast(text,prob,due,base){return doPredict(text,prob,due||'');}
function doResolve(id,outcome){
  const p=DB.predictions.find(x=>x.id===id);if(!p)return 'no forecast #'+id;
  outcome=String(outcome).toLowerCase();
  if(['true','hit','yes','1'].includes(outcome))p.outcome='hit';
  else if(['false','miss','no','0'].includes(outcome))p.outcome='miss';
  else if(outcome==='partial')p.outcome='partial';
  else return 'use true/false';
  saveDB();return '#'+id+' resolved: '+p.outcome;
}

/* ================= commands ================= */
function review(){
  const b=brier();
  const open=DB.predictions.filter(p=>!p.outcome);
  const L=[];
  L.push('🧠 '+DB.name+' — self review');
  L.push('Facts: '+DB.facts.length+' | Learnings: '+DB.learnings.length+' | Episodes: '+DB.episodes.length);
  const br=b?'Brier '+b.score.toFixed(3)+' over '+b.n+' resolved (0=perfect, 0.25=coin flip)':'No resolved forecasts yet — Brier needs data';
  L.push(br);
  L.push('Open forecasts: '+open.length+(open.length?' — '+open.slice(0,3).map(p=>'#'+p.id+' '+p.prob+'%').join(', '):''));
  L.push('Top learnings:');
  DB.learnings.slice(-3).forEach(l=>L.push('• '+l.text));
  if(DB.capabilities.length)L.push('Capabilities: '+DB.capabilities.map(c=>c.version).join(', '));
  return L.join('\n');
}
function stats(){
  const b=brier();const r=DB.predictions.filter(p=>p.outcome==='hit'||p.outcome==='miss');
  const hits=r.filter(p=>p.outcome==='hit').length;
  return 'Facts '+DB.facts.length+' • Learnings '+DB.learnings.length+' • Episodes '+DB.episodes.length+'\nForecasts: '+r.length+' resolved ('+hits+' hit)'+(b?' • Brier '+b.score.toFixed(3):'')+' • '+DB.predictions.filter(p=>!p.outcome).length+' open';
}
async function runCommand(text){
  const t=text.trim();
  if(t==='/help')return 'Commands:\n/predict <text> | <conf> | [due]\n/forecast <text> | <prob 1-99> | [due]\n/resolve <id> true|false\n/review  /stats  /calibration  /memories\n/act <task> — do multi-step work with tools\n/name <name> — rename me';
  if(t==='/review')return review();
  if(t==='/stats')return stats();
  if(t==='/calibration'){const b=brier();return (b?'Brier score: '+b.score.toFixed(3)+' over '+b.n+' resolved forecasts.\n(0 = perfect, 0.25 = coin flip)\n\n':'No resolved forecasts yet.\n\n')+calibration();}
  if(t==='/memories')return DB.facts.length?DB.facts.map(f=>'• '+f.key+': '+f.value).join('\n'):'No facts stored yet.';
  if(t.startsWith('/name ')){DB.name=t.slice(6).trim()||DB.name;saveDB();updateTitle();return 'Renamed to '+DB.name+'.';}
  if(t.startsWith('/predict ')||t.startsWith('/forecast ')){
    const parts=t.split('|').map(s=>s.trim());
    const txt=parts[0].replace(/^\/(predict|forecast)\s*/,'');
    const prob=Number(parts[1]);
    if(!txt||!(prob>=1&&prob<=99))return 'usage: /forecast <text> | <prob 1-99> | [due date]';
    const id=doForecast(txt,prob,parts[2]||'');
    return 'Forecast #'+id+' logged at '+prob+'%. Never 0/100 — stay honest.';
  }
  if(t.startsWith('/resolve ')){const p=t.split(/\s+/);if(p.length<3)return 'usage: /resolve <id> true|false';return doResolve(Number(p[1]),p[2]);}
  if(t.startsWith('/act ')){const task=t.slice(5).trim();if(!task)return 'usage: /act <task>';return await act(task);}
  return null;
}
/* ================= act loop (hands) ================= */
const TOOL_DEFS=[
 ['web_search','Search the web. args: {query, num?}'],
 ['run_code','Run JavaScript in a sandbox (10s). args: {code} — console.log captured, return value reported.'],
 ['note_write','Save a private note. args: {path, content}'],
 ['note_read','Read a private note. args: {path}'],
 ['note_list','List private notes. args: {}'],
 ['brain_search','Search your own memory. args: {query}'],
 ['forecast','Log a prediction. args: {text, probability, due_date}']
].map(([n,d])=>'- '+n+': '+d).join('\n');
const ACT_SYS='You are {name}, and you can ACT — not just talk. You have hands: tools you can call to do real multi-step work.\n\nHOW TO USE TOOLS: when the task needs real work, output EXACTLY this and nothing else:\n```tool\n{"name": "tool_name", "args": {...}}\n```\nYou will receive the tool\'s result as the next message. Chain tools as needed, verify results before reporting, be efficient. When done, answer normally (no tool block). Max 8 steps.\n\nTOOLS:\n'+TOOL_DEFS+'\n\nRules:\n- web_search needs a Serper key in settings; if unavailable, work around it.\n- run_code runs sandboxed JS with a 10s timeout; use it for calculations and data crunching.\n- notes are private to this browser.\n- brain_search queries your own memory; forecast logs a prediction.\n- If a tool errors, read the error and try a different approach before giving up.';
function parseToolCall(text){const m=/```tool\s*\n([\s\S]*?)\n```/.exec(text||'');if(!m)return null;try{const d=JSON.parse(m[1]);return d&&d.name?[d.name,d.args||{}]:null;}catch(e){return null;}}
async function runCode(code){
  return new Promise(res=>{
    const src='onmessage=function(e){var logs=[];var c={log:function(){logs.push(Array.prototype.join.call(arguments," "))}};try{var r=(new Function("console",e.data))(c);postMessage({ok:true,result:String(r),logs:logs.join("\\n")});}catch(err){postMessage({ok:false,error:String((err&&err.message)||err)});}}';
    let done=false;const fin=o=>{if(!done){done=true;res(o);}};
    try{
      const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
      const t=setTimeout(()=>{try{w.terminate();}catch(e){}fin({error:'timed out after 10s'});},10000);
      w.onmessage=e=>{clearTimeout(t);try{w.terminate();}catch(x){}fin(e.data);};
      w.onerror=e=>{clearTimeout(t);fin({error:'worker error'});};
      w.postMessage(String(code));
    }catch(e){fin({error:'sandbox unavailable: '+e.message});}
  });
}
async function webSearch(q,num){
  if(!CFG.serper)return {error:'SERPER_KEY not set — web search unavailable (add it in settings)'};
  try{
    const r=await fetch('https://google.serper.dev/search',{method:'POST',headers:{'X-API-KEY':CFG.serper,'Content-Type':'application/json'},body:JSON.stringify({q,num:Math.max(1,Math.min(num||5,10))})});
    if(!r.ok)return {error:'search failed: HTTP '+r.status};
    const d=await r.json();
    return (d.organic||[]).slice(0,num||5).map(it=>({title:it.title,snippet:it.snippet,link:it.link}));
  }catch(e){return {error:'search failed: '+e.message};}
}
const NOTES_KEY='machine_notes_v1';
function notes(){try{return JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');}catch(e){return{};}}
function saveNotes(n){localStorage.setItem(NOTES_KEY,JSON.stringify(n));}
async function dispatchTool(name,args){
  args=args||{};
  if(name==='web_search')return webSearch(args.query,args.num);
  if(name==='run_code')return runCode(args.code||'');
  if(name==='note_write'){if(!args.path)return{error:'path needed'};const n=notes();n[String(args.path).slice(0,80)]=String(args.content||'').slice(0,20000);saveNotes(n);return{written:args.path};}
  if(name==='note_read'){const n=notes();const v=n[args.path];return v==null?{error:'not found'}:{path:args.path,content:String(v).slice(0,8000)};}
  if(name==='note_list')return{notes:Object.keys(notes())};
  if(name==='brain_search')return{matches:recall(args.query||'',5).map(m=>m.t)};
  if(name==='forecast'){if(!args.text||!(args.probability>=1&&args.probability<=99))return{error:'need text + probability 1-99'};const id=doForecast(args.text,args.probability,args.due_date||'');return{forecast_id:id,logged:true};}
  return{error:'unknown tool: '+name};
}
async function act(task,log){
  const msgs=[{role:'system',content:ACT_SYS.replace('{name}',DB.name)+'\n\n'+sysPrompt(task)},{role:'user',content:task}];
  let final=null;const steps=[];
  for(let i=0;i<8;i++){
    let reply;try{reply=await llm(msgs);}catch(e){final='Tool run failed: '+e.message;break;}
    msgs.push({role:'assistant',content:reply});
    const call=parseToolCall(reply);
    if(!call){final=reply;break;}
    if(log)log('🔧 '+call[0]+'…');
    let result;try{result=await dispatchTool(call[0],call[1]);}catch(e){result={error:String(e.message||e)};}
    steps.push({tool:call[0],args:call[1]});
    msgs.push({role:'user',content:'Tool result ('+call[0]+'):\n'+JSON.stringify(result).slice(0,4000)});
  }
  if(final==null)final='I ran out of steps. Partial progress: '+steps.length+' tool calls.';
  addEp('user','[act] '+task);addEp('assistant',final);
  absorb(task,final).catch(()=>{});
  return final;
}

async function syncState(quiet){
  try{
    const r=await fetch(STATE_URL+'?t='+Date.now(),{cache:'no-store'});

    const s=await r.json();
    let n=0;
    (s.facts||[]).forEach(f=>{
      if(!DB.facts.find(x=>x.key===f.key)){DB.facts.push({id:DB.seq.fact++,key:f.key,value:f.value,conf:f.conf||70,ts:f.ts||Date.now()});n++;}
    });
    (s.learnings||[]).forEach(l=>{

    });
    (s.predictions||[]).forEach(p=>{
      if(!DB.predictions.find(x=>x.text===p.text)){DB.predictions.push({id:DB.seq.pred++,text:p.text,prob:p.prob||50,due:p.due||'',base:p.base||'',outcome:p.outcome||null,ts:p.ts||Date.now()});n++;}
    });
    if(n)saveDB();

}
function ago(ts){if(!ts)return 'never';const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago';}
