<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Machine</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--acc2:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
header h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.hspace{flex:1}
.iconbtn{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.iconbtn:active{background:#21262d}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;border:1px dashed var(--border);color:var(--dim);font-size:13px;max-width:95%}
.msg pre{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:8px;margin:6px 0;overflow-x:auto;font-size:13px}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace}
.typing{color:var(--dim);font-style:italic}
#bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
#row{display:flex;gap:8px}
#in{flex:1;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;resize:none;max-height:120px}
#in:focus{border-color:var(--acc)}
#send{background:#1f6feb;color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:16px;cursor:pointer}
#send:active{opacity:.85}
#hints{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.hint{flex-shrink:0;font-size:12px;color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:5px 11px;cursor:pointer;background:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:18px}
#modal.open{display:flex}
#sheet{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:480px;width:100%;max-height:88dvh;overflow-y:auto;padding:20px}
#sheet h2{font-size:17px;margin-bottom:4px}
#sheet p.d{font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.5}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.f input{width:100%;background:#0d1117;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:15px}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
#brainpanel{font-size:13px;color:var(--dim);line-height:1.9}
#brainpanel b{color:var(--text)}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0}
</style>
</head>

rnings.", "conf": 70.0}, {"text": "Niche velocity baseline: median 0.4 views/hour across 78 recent videos (The DRAX, Titantron MHD, UlterMonster Wrestling, VokerTheBeast 2K, WrestleMania 2K, Wrestling With Simulations). Videos beating 3x median are outliers worth studying.", "conf": 80.0}, {"text": "Top-decile velocity videos share title terms: randy, orton, highlights, subscribe, rkos, simulation, aew, all. Test these patterns against the baseline before adopting.", "conf": 65.0}, {"text": "Fastest video right now: 'SUBSCRIBE \ud83d\udca2 RANDY ORTON RKOs RANDY ORTON Onto a Chair' (UlterMonster Wrestling) at 61.9 views/hour \u2014 163.0x the niche median.", "conf": 75.0}], "predictions": [{"text": "At least one new frontier AI model release will be announced in the next 14 days", "prob": 50, "due": "", "base": "Sep 2026 saw ~10 major model releases in 30 days across OpenAI/Anthropic/Google/DeepSeek/xAI"}, {"text": "YouTube announces another monetization or AI-content policy clarification before Nov 1, 2026", "prob": 50, "due": "", "base": "Major moves roughly semi-annual: inauthentic-content rename Jul 2025, Jan 2026 sweep, Jul 2026 clarification"}, {"text": "WWE Money in the Bank (Oct 10, New Orleans) sells out the Smoothie King Center", "prob": 50, "due": "", "base": "Recent WWE PLEs in similar arenas have mostly sold out; Perth 3-event weekend shows strong demand"}], "capabilities": [{"version": "v0.1", "note": "Genesis: persistent memory (facts, episodes), learning extraction, predictions ledger with scoring, capabilities log."}, {"version": "v0.2", "note": "Senses online: 6-topic web-scan watchlist, autonomous scanner (scan.py, needs SERPER_KEY), assisted feed pipeline (feed.py), scan protocol. First live scan 2026-09-29: 12 items."}, {"version": "v0.3", "note": "Prediction engine: probabilistic forecasts with Brier scoring, calibration report, base-rate discipline; watchlist expanded to 9 topics (world, science, markets)."}, {"version": "v0.4", "note": "Scheduled autonomy: ai-brain-scan cron every 6h (rotating watchlist scans, feeds brain) + ai-brain-nightly-review cron (calibration report, forecast checks). The brain now learns continuously with zero human input."}, {"version": "v0.5", "note": "Continuous learning: scan cadence tightened to hourly, day and night. Each run now rotates, deep-dives (full articles), or EXPANDS the watchlist itself \u2014 the senses grow on their own."}, {"version": "v0.6", "note": "YouTube sense built (Stage 1 of YouTube mastery): Data API client, view-velocity tracker, niche summarizer that learns baselines + top-decile title patterns. Dormant until YOUTUBE_API_KEY is set (free tier)."}, {"version": "v0.7", "note": "YouTube sense LIVE: first real scan \u2014 78 videos across 6 niche channels (his + 5 competitors). API key verified and moved to Secure Vault (custom.youtube); hourly cron now includes the YouTube velocity scan."}, {"version": "v0.8", "note": "hands: multi-step tool loop (brain.act / /act). Tools: web_search, run_python (30s), sandboxed files, youtube_velocity, youtube_channel_info via youtube skill, brain_search, forecast. Up to 8 chained steps; every act logged and absorbed."}]};
/* ================= config ================= */
const CFG_KEY='machine_cfg_v1';
let CFG=Object.assign({base:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-3.1-flash-lite',key:'',serper:'',ytkey:'',provider:'key'},JSON.parse(localStorage.getItem(CFG_KEY)||'{}'));
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}

/* ================= store ================= */
const DB_KEY='machine_brain_v1';
let DB=null;
function loadDB(){
  try{DB=JSON.parse(localStorage.getItem(DB_KEY)||'null');}catch(e){DB=null;}
  if(!DB||DB.v!==1){
    DB={v:1,name:'Machine',facts:[],episodes:[],learnings:[],predictions:[],capabilities:[],seq:{fact:1,ep:1,learn:1,pred:1}};
    if(typeof SEED!=='undefined'&&SEED){
      (SEED.facts||[]).forEach(f=>DB.facts.push({id:DB.seq.fact++,key:f.key,value:f.value,conf:f.confidence||f.conf||70,ts:Date.now()}));
      (SEED.learnings||[]).forEach(l=>DB.learnings.push({id:DB.seq.learn++,text:l.text,conf:l.confidence||l.conf||70,ts:Date.now()}));
      (SEED.predictions||[]).forEach(p=>DB.predictions.push({id:DB.seq.pred++,text:p.text,prob:p.probability||p.prob||50,due:p.due_date||p.due||'',base:p.base_rate||'',outcome:null,ts:Date.now()}));
      (SEED.capabilities||[]).forEach(c=>DB.capabilities.push({version:c.version,note:c.note}));
    }
    saveDB();
  }
  return DB;
}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function addEp(role,text){DB.episodes.push({id:DB.seq.ep++,role,text:String(text).slice(0,2000),ts:Date.now()});if(DB.episodes.length>400)DB.episodes=DB.episodes.slice(-400);saveDB();}

/* ================= llm ================= */
async function llm(messages,opts){
  opts=opts||{};
  if(CFG.provider==='browser')return llmBrowser(messages,opts);
  if(!CFG.key)throw new Error('no-key');
  const models=[CFG.model,'gemini-3-flash-preview','gemini-flash-latest'].filter((v,i,a)=>v&&a.indexOf(v)===i);
  let lastErr=null;
  for(const m of models){
    try{return await llmOnce(messages,m,opts);}
    catch(e){lastErr=e;if(!/API (404|429|503)/.test(e.message))throw e;}
  }
  throw lastErr;
}
async function llmOnce(messages,model,opts){
  opts=opts||{};
  const r=await fetch(CFG.base.replace(/\/$/,'')+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},
    body:JSON.stringify({model:model,messages,temperature:opts.temp!=null?opts.temp:0.7,max_tokens:opts.max||1500})
  });
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('API '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.choices[0].message.content;
}

/* ---- model catalog: what this brain is allowed to run ---- */
const MODELS=[
 {v:'gemini-3.1-flash-lite',l:'Gemini 3.1 Flash-Lite (default — fast, free)'},
 {v:'gemini-3-flash-preview',l:'Gemini 3 Flash Preview (verified working)'},
 {v:'gemini-flash-latest',l:'Gemini Flash — latest alias'},
 {v:'gemini-2.5-pro',l:'Gemini 2.5 Pro (smarter, slower)'},
 {v:'gemini-3.1-pro-preview',l:'Gemini 3.1 Pro Preview (smartest)'}
];
const RETIRED_MODELS=['gemini-2.0-flash','gemini-2.5-flash','gemini-1.5-flash','gpt-4o-mini'];
function isCustomModel(){return MODELS.every(m=>m.v!==CFG.model);}
/* migrate anyone stuck on a retired model */
if(RETIRED_MODELS.includes(CFG.model)){CFG.model='gemini-3.1-flash-lite';saveCfg();}

/* ---- browser built-in AI (Chrome Prompt API / Gemini Nano, no key) ---- */
let _bsess=null,_bsys='';
async function llmBrowser(messages,opts){
  opts=opts||{};
  if(!('LanguageModel' in window))throw new Error('browser-ai-unavailable');
  let avail='unknown';
  try{avail=await LanguageModel.availability();}catch(e){}
  if(avail==='unavailable')throw new Error('browser-ai-unavailable');
  const sys=(messages.find(m=>m.role==='system')||{}).content||'';
  const turns=messages.filter(m=>m.role!=='system');
  const last=turns[turns.length-1]||{content:''};
  const hist=turns.slice(0,-1).map(m=>(m.role==='user'?'User: ':'Assistant: ')+m.content).join('\n');
  try{
    if(!_bsess||_bsys!==sys){
      if(_bsess){try{_bsess.destroy();}catch(e){}}
      _bsess=await LanguageModel.create({systemPrompt:sys.slice(0,4000),temperature:opts.temp!=null?opts.temp:0.7,topK:40});
      _bsys=sys;
    }
    const prompt=(hist?hist+'\n':'')+'User: '+last.content;
    return await _bsess.prompt(prompt.slice(0,12000));
  }catch(e){
    try{if(_bsess){_bsess.destroy();}}catch(x){}
    _bsess=null;_bsys='';
    throw e;
  }
}
async function browserAiStatus(){
  if(!('LanguageModel' in window))return 'not supported in this browser';
  try{return await LanguageModel.availability();}
  catch(e){return 'unknown: '+e.message;}
}

/* ================= recall ================= */
function tokens(s){return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3);}
function score(q,t){const a=tokens(q),b=new Set(tokens(t));if(!a.length)return 0;let h=0;a.forEach(w=>{if(b.has(w))h++;});return h/Math.sqrt(a.length);}
function recall(q,k){
  k=k||6;const out=[];
  DB.facts.forEach(f=>out.push({s:score(q,f.key+' '+f.value)+0.2,kind:'fact',t:f.key+': '+f.value}));
  DB.learnings.forEach(l=>out.push({s:score(q,l.text),kind:'learning',t:l.text+' (conf '+l.conf+')'}));
  DB.episodes.slice(-60).forEach(e=>out.push({s:score(q,e.text)*0.7,kind:'ep',t:e.role+': '+e.text.slice(0,160)}));
  return out.filter(o=>o.s>0.15).sort((a,b)=>b.s-a.s).slice(0,k);
}
function sysPrompt(q){
  const mems=recall(q,6).map(m=>'- '+m.t).join('\n')||'(no relevant memories yet)';
  const learns=DB.learnings.slice(-12).map(l=>'- '+l.text+' (conf '+l.conf+')').join('\n')||'(no learnings yet — the brain is young)';
  let channel='';
  const mc=(typeof LAST_STATE!=='undefined'&&LAST_STATE&&LAST_STATE.my_channel)||null;
  if(mc&&mc.subs){
    const tops=(mc.top_videos||[]).slice(0,4).map(v=>'- "'+v.title+'" '+v.views+' views ('+v.velocity+'/hr)').join('\n');
    channel='\nYour owner\'s YouTube channel (live data, updated hourly):\nChannel: '+mc.title+' — '+mc.subs+' subscribers, '+mc.views+' total views, '+mc.video_count+' videos.\nFastest recent videos:\n'+(tops||'(none)')+'\nAnswer questions about his channel, subs, views and video performance directly from this data — no tool needed.';
  }
  let alm='';
  const almanac=(typeof LAST_STATE!=='undefined'&&LAST_STATE&&LAST_STATE.almanac)||null;
  if(almanac&&Object.keys(almanac).length){

function brier(){const r=DB.predictions.filter(p=>p.outcome==='hit'||p.outcome==='miss');if(!r.length)return null;let s=0;r.forEach(p=>{const f=p.prob/100;s+=(f-(p.outcome==='hit'?1:0))**2;});return {score:s/r.length,n:r.length};}
function calibration(){
  const r=DB.predictions.filter(p=>p.outcome==='hit'||p.outcome==='miss');
  const buckets=[[1,20],[21,40],[41,60],[61,80],[81,99]];
  return buckets.map(([lo,hi])=>{
    const b=r.filter(p=>p.prob>=lo&&p.prob<=hi);
    if(!b.length)return lo+'–'+hi+'%: no resolved forecasts';
    const hit=b.filter(p=>p.outcome==='hit').length,rate=Math.round(hit/b.length*100);
    const avg=Math.round(b.reduce((s,p)=>s+p.prob,0)/b.length);
    let flag='';
    if(b.length>=3){if(rate<avg-20)flag=' ⚠️ overconfident';else if(rate>avg+20)flag=' ⚠️ underconfident';}
    return lo+'–'+hi+'%: said ~'+avg+'%, hit '+rate+'% ('+hit+'/'+b.length+')'+flag;
  }).join('\n');
}
function doPredict(text,conf,due){const id=DB.seq.pred++;DB.predictions.push({id,text,prob:Math.max(1,Math.min(99,conf)),due:due||'',base:'',outcome:null,ts:Date.now()});saveDB();return id;}

function doResolve(id,outcome){

  if(['true','hit','yes','1'].includes(outcome))p.outcome='hit';
  else if(['false','miss','no','0'].includes(outcome))p.outcome='miss';
  else if(outcome==='partial')p.outcome='partial';

  saveDB();return '#'+id+' resolved: '+p.outcome;
}

function stampThumbText(blob,title,subtitle,W,H){

      try{

        const x=c.getContext('2d');

        x.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);
        URL.revokeObjectURL(url);
        x.textBaseline='top';x.lineJoin='round';
        const lines=[];
        if(title)lines.push({t:String(title).toUpperCase().slice(0,30),c:'#ffffff'});
        if(subtitle)lines.push({t:String(subtitle).toUpperCase().slice(0,30),c:'#ffd400'});
        let y=Math.round(H*0.07);
        lines.forEach(function(L){
          let fs=Math.round(H*0.16);
          x.font='900 '+fs+'px Arial,Helvetica,sans-serif';
          while(x.measureText(L.t).width>W-90&&fs>24){fs-=6;x.font='900 '+fs+'px Arial,Helvetica,sans-serif';}
          x.lineWidth=Math.max(5,Math.round(fs/12));x.strokeStyle='rgba(0,0,0,0.95)';
          x.strokeText(L.t,44,y);x.fillStyle=L.c;x.fillText(L.t,44,y);
          y+=Math.round(fs*1.12);
        });
        c.toBlob(function(b){
          if(!b){rej(new Error('canvas export failed'));return;}
          blobToB64(b).then(function(b64){res('data:'+(b.type||'image/jpeg')+';base64,'+b64);},rej);
        },'image/jpeg',0.92);
      }catch(e){rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('could not decode image'));};
    im.src=url;
  });
}

    if(hit&&!args.refresh)return Object.assign({cached:true},hit);
    if(!CFG.ytkey)return{error:'no YouTube Data API key in settings - add one (free) to look up any channel'};
    let cid=q;
    if(!/^UC[a-zA-Z0-9_-]{22}$/.test(q)){
      const s=await ytApi('search?part=snippet&type=channel&maxResults=1&q='+encodeURIComponent(q));
      const item=(s.items||[])[0];
      if(!item)return{error:'no channel found for "'+q+'"'};
      cid=item.id.channelId;
    }
    const c=await ytApi('channels?part=snippet,statistics&id='+cid);
    const ch=(c.items||[])[0];
    if(!ch)return{error:'channel lookup failed'};
    const rec={id:cid,name:ch.snippet.title,subscribers:ch.statistics.subscriberCount,total_views:ch.statistics.viewCount,video_count:ch.statistics.videoCount,ts:Date.now()};

  }
  if(name==='youtube_video'){
    const q=(args.query||'').trim();
    if(!q)return{error:'video title, ID or watch URL needed'};
    const cache=ytcache();

    const idLike=/^[a-zA-Z0-9_-]{11}$/.test(q)?q:urlId;
    if(idLike&&cache.videos[idLike]&&!args.refresh)return Object.assign({cached:true},cache.videos[idLike]);
    if(!CFG.ytkey)return{error:'no YouTube Data API key in settings - add one (free) to look up any video'};
    let vid=idLike;

      const item=(s.items||[])[0];
      if(!item)return{error:'no video found for "'+q+'"'};
      vid=item.id.videoId;
    }
    if(cache.videos[vid]&&!args.refresh)return Object.assign({cached:true},cache.videos[vid]);
    const v=await ytApi('videos?part=snippet,statistics,contentDetails&id='+vid);

    cache.videos[vid]=rec;saveYtcache(cache);
    return Object.assign({url:'https://www.youtube.com/watch?v='+vid,cached:false},rec);
  }
  if(name==='channel_stats'){
    const mc=(LAST_STATE&&LAST_STATE.my_channel)||null;
    if(!mc||!mc.subs)return{error:'channel data not synced yet — try again in a minute'};

    return{channel:mc.title,subscribers:mc.subs,total_views:mc.views,video_count:mc.video_count,
      checked:mc.checked_at?new Date(mc.checked_at*1000).toLocaleString():'unknown',
      fastest_recent:(mc.top_videos||[]).slice(0,5).map(v=>v.title+' — '+v.views+' views ('+v.velocity+' views/hr)'),
      niche_context:niche};
  }
  if(name==='forecast'){if(!args.text||!(args.probability>=1&&args.probability<=99))return{error:'need text + probability 1-99'};const id=doForecast(args.text,args.probability,args.due_date||'');return{forecast_id:id,logged:true};}

async function geminiImageGen(key,body,quick){
  if(quick){
    const ctl=new AbortController();const to=setTimeout(function(){ctl.abort();},25000);
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
      clearTimeout(to);
      const d=await r.json().catch(function(){return{};});
      if(d.error)throw new Error(String(d.error.message||('image api '+r.status)));
      return d;
    }catch(e){clearTimeout(to);throw e;}
  }
  const waits=[0,25000,70000,140000];
  let lastErr=null;
  for(let i=0;i<waits.length;i++){
    if(waits[i])await new Promise(function(r){setTimeout(r,waits[i]);});
    let r,d;
    try{
      r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      d=await r.json().catch(function(){return{};});
    }catch(e){lastErr=e;if(i<waits.length-1)continue;throw e;}
    if(d.error){
      const msg=String(d.error.message||('image api '+r.status));
      if(/plan and billing|billing details/i.test(msg))
        throw new Error('the free image allowance on this key is used up (chat still works — only image generation is capped). It resets on its own; try the thumbnail again later and it will go through.');
      const limited=(d.error.code===429||r.status===429||/quota|rate limit|resource.?exhausted/i.test(msg));
      if(limited&&i<waits.length-1){lastErr=new Error(msg);continue;}
      if(limited)throw new Error('free-tier image limit hit — even after waiting. Give it a few minutes and try again; nothing is broken.');
      throw new Error(msg);
    }
    return d;
  }
  throw lastErr||new Error('image generation failed');
}
  if(name==='generate_thumbnail'){
    const prompt=String(args.prompt||'').slice(0,800);
    if(!prompt)return{error:'describe the thumbnail first (subject, text, mood)'};
    const aspect=/^(16:9|9:16|1:1)$/.test(args.aspect)?args.aspect:'16:9';
    const title=String(args.title||'').slice(0,40),subtitle=String(args.subtitle||'').slice(0,40);
    const starQ=String(args.superstar||'').trim().toLowerCase();
    function geminiImg(parts,quick){
      return geminiImageGen(CFG.key,{contents:[{parts:parts}],generationConfig:{responseModalities:['TEXT','IMAGE'],imageConfig:{aspectRatio:aspect}}},quick)
        .then(function(d){
          const ps=(((d.candidates||[])[0]||{}).content||{}).parts||[];
          for(let i=0;i<ps.length;i++){if(ps[i].inlineData&&ps[i].inlineData.data)return 'data:'+(ps[i].inlineData.mimeType||'image/png')+';base64,'+ps[i].inlineData.data;}
          throw new Error('no image came back');
        });
    }
    if(starQ){
      if(!CFG.key)return{error:'real-superstar thumbnails need your Gemini key in settings — the free fallback cannot do real faces (owner rule: never AI faces). Add the key, or drop superstar: for a free-service thumbnail.'};
      const stars=await getStars();
      const hit=stars.find(function(s){return s.id===starQ||s.name.toLowerCase()===starQ||s.name.toLowerCase().indexOf(starQ)>=0;});
      if(!hit)return{error:'no superstar photo for "'+args.superstar+'" — available: '+stars.map(function(s){return s.id;}).join(', ')};
      const br=await fetch('stars/'+hit.file);
      if(!br.ok)return{error:'could not load photo for '+hit.name};
      const b64=await blobToB64(await br.blob());
      const txt='Use the attached real photo of WWE superstar '+hit.name+'. Keep their face, likeness and appearance photorealistic and instantly recognizable — do not change who they are, do not cartoon-ify them. Place them into this YouTube thumbnail scene: '+prompt+'. YouTube thumbnail, '+aspect+' aspect ratio, bold huge readable title text, vivid high contrast colors, no watermark, no logo.';
      let dataUrl;
      try{dataUrl=await geminiImg([{inlineData:{mimeType:'image/jpeg',data:b64}},{text:txt}],true);}
      catch(e){return{error:'image generation failed ('+e.message+'). Real-photo thumbnails cannot use the free fallback — it would generate fake faces, which is forbidden. Try again later.'};}
      PENDING_IMAGES.push(dataUrl);
      return{thumbnail_ready:true,aspect:aspect,superstar:hit.name,via:'gemini (real photo)',note:'Thumbnail generated starring the real '+hit.name+' — shown in chat below with a download link.'};
    }
    let dataUrl=null,via='';
    if(CFG.key){
      try{dataUrl=await geminiImg([{text:'YouTube thumbnail, '+aspect+' aspect ratio, bold eye-catching design, huge readable title text, ultra-expressive subject, vivid high contrast colors, no watermark, no logo: '+prompt}],true);via='gemini';}
      catch(e){/* fall through to the free service */}
    }
    if(!dataUrl){
      try{dataUrl=await pollinationsThumb(prompt,title,subtitle,aspect);via='free image service (no key needed)';}
      catch(e){return{error:'both image routes failed right now ('+e.message+'). Try again in a bit.'};}
    }
    PENDING_IMAGES.push(dataUrl);
    return{thumbnail_ready:true,aspect:aspect,via:via,note:'Thumbnail generated via '+via+' — shown in chat below with a download link.'};
  }
  return{error:'unknown tool: '+name};
}
async function act(task,log){
  const msgs=[{role:'system',content:ACT_SYS.replace('{name}',DB.name)+'\n\n'+sysPrompt(task)},{role:'user',content:task}];
  let final=null;const steps=[];
  for(let i=0;i<8;i++){
    let reply;try{reply=await llm(msgs);}catch(e){final='Tool run failed: '+e.message;break;}
    msgs.push({role:'assistant',content:reply});
    const call=parseToolCall(reply);
    if(!call){final=reply;break;}
    if(log)log('🔧 '+call[0]+'…');
    let result;try{result=await dispatchTool(call[0],call[1]);}catch(e){result={error:String(e.message||e)};}
    steps.push({tool:call[0],args:call[1]});
    msgs.push({role:'user',content:'Tool result ('+call[0]+'):\n'+JSON.stringify(result).slice(0,4000)});
  }
  if(final==null)final='I ran out of steps. Partial progress: '+steps.length+' tool calls.';
  addEp('user','[act] '+task);addEp('assistant',final);
  absorb(task,final).catch(()=>{});
  return final;
}

const STATE_URL='state.json';
let lastSync=0;
let LAST_STATE=null;
async function syncState(quiet){
  try{
    const r=await fetch(STATE_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return false;
    const s=await r.json();
    LAST_STATE=s;
    let n=0;
    (s.facts||[]).forEach(f=>{
      if(!DB.facts.find(x=>x.key===f.key)){DB.facts.push({id:DB.seq.fact++,key:f.key,value:f.value,conf:f.conf||70,ts:f.ts||Date.now()});n++;}
    });
    (s.learnings||[]).forEach(l=>{
      if(!DB.learnings.find(x=>x.text===l.text)){DB.learnings.push({id:DB.seq.learn++,text:l.text,conf:l.conf||70,ts:l.ts||Date.now()});n++;}
    });
    (s.predictions||[]).forEach(p=>{
      if(!DB.predictions.find(x=>x.text===p.text)){DB.predictions.push({id:DB.seq.pred++,text:p.text,prob:p.prob||50,due:p.due||'',base:p.base||'',outcome:p.outcome||null,ts:p.ts||Date.now()});n++;}
    });
    if(n)saveDB();
    lastSync=Date.now();
    if(s.exported_at)DB._synced_at=s.exported_at;
    renderFeed(s);
    updateTitle();
    if(n&&!quiet)sysMsg('🌬️ Breathed in '+n+' new thing'+(n>1?'s':'')+' from the living brain.');
    return true;
  }catch(e){return false;}
}
