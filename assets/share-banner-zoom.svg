<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- This SVG wraps the uploaded banner.jpg and ensures it's fully visible (meet) so social previews won't crop important edges -->
  <rect width="1200" height="630" fill="#0b1220" />
  <!-- place the raster banner.jpg centered and scaled to 'meet' so entire image fits with possible letterboxing -->
  <image href="assets/banner.jpg" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid meet"/>
  <!-- subtle overlay vignette to match site tone -->
  <radialGradient id="v" cx="50%" cy="50%" r="70%">
	<stop offset="0%" stop-color="#000000" stop-opacity="0" />
	<stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
  </radialGradient>
  <rect width="1200" height="630" fill="url(#v)" />
</svg>